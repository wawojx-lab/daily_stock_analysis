name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 10 * * 1-5'   # Weekdays 10:00 UTC -> 18:00 Beijing
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STOCK_LIST: ${{ secrets.STOCK_LIST }}
      ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
      AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f setup.py ]; then pip install .; fi

      - name: Run daily analysis
        run: |
          # adjust flags if your repo requires different args (e.g., --schedule / --webui)
          python main.py --schedule
        shell: bash

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-stock-reports
          path: |
            reports/**
            outputs/**
            *.png
            *.md
          if-no-files-found: ignore
